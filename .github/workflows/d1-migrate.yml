# 本番の D1 にマイグレーションを適用する(Actions 画面の「Run workflow」から手動で実行する)
# 必要なリポジトリの Secrets:
#   CLOUDFLARE_API_TOKEN  … D1 の編集権限(Account › D1 › Edit)を持つ API トークン
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare のアカウント ID
name: D1 マイグレーション

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '未適用のマイグレーションを表示するだけで、適用しない'
        type: boolean
        default: false

# 同時に2つ走らないようにする
concurrency:
  group: d1-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.141.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Secrets があるか確かめる
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::リポジトリの Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を設定してください"
            exit 1
          fi

      - name: 未適用のマイグレーションを表示する
        run: |
          $WRANGLER d1 migrations list tsu-wiki-db --remote | tee list.txt
          # 最初のマイグレーションが未適用に出たら、適用済みの記録が本番にないので止める(0001 から流し直すとエラーになるため)
          if grep -q '0001_pcs.sql' list.txt; then
            echo "::error::0001_pcs.sql が未適用と表示されました。本番の適用済みの記録(d1_migrations)を確かめてください"
            exit 1
          fi

      - name: マイグレーションを適用する
        if: ${{ !inputs.dry_run }}
        run: $WRANGLER d1 migrations apply tsu-wiki-db --remote
